<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vela</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong one.
      // Validate against known theme ids so a stale/removed value (e.g. the old
      // "light"/"system") falls back to dark instead of applying a dead data-theme.
      (function () {
        try {
          var ids = ["dark", "oled", "dracula", "nord", "solarized-dark", "gruvbox-dark", "solarized-light", "gruvbox-light", "catppuccin-latte", "rose-pine-dawn", "one-light"];
          var t = localStorage.getItem("vela-theme");
          document.documentElement.setAttribute("data-theme", ids.indexOf(t) >= 0 ? t : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
