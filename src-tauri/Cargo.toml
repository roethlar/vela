[package]
name = "vela"
version = "1.0.57"
description = "mpv-backed HDR media client (Plex, Jellyfin, Emby)"
authors = ["Michael Coelho"]
license = "MIT"
edition = "2021"
# Floor driven by std::fs::File::lock (stable 1.89); also uses is_none_or (1.82),
# Result::inspect_err (1.76), io::Error::other (1.74).
rust-version = "1.89"

[lib]
name = "vela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "charset", "http2", "system-proxy", "native-tls-no-alpn"] }
tokio = { version = "1", features = ["full"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde-xml-rs = "0.8.0"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
directories = "6.0"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-trait = "0.1"
tauri-plugin-dialog = "2"
base64 = "0.22"
if-addrs = "0.15"
sha2 = "0.10"

# `test-util` is not part of tokio's `full`. It buys paused time, which is the
# only way to assert a teardown deadline actually fires without the test
# waiting out that deadline in real seconds.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSScreen"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSObject", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# crates.io's wayland-scanner 0.31.10 still pins vulnerable quick-xml 0.39.
# The vendored crate is that exact release with only its compatible quick-xml
# requirement updated to 0.41, keeping the released client/runtime API intact.
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }

# Smaller, faster release binary for a desktop app. (Debug builds, which the
# Tauri dev workflow uses, are unaffected.)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
