name: Release

# Builds installable bundles for every target OS. Run it manually from the
# Actions tab (workflow_dispatch) to get downloadable artifacts, or push a
# `v*` tag to also attach them to a draft GitHub release.
#
# The mpv PROGRAM is intentionally NOT bundled — Vela detects it at runtime and
# prompts the user to install it (copyable command + "Get mpv" link), so the
# default player stays user-updatable.
#
# The Linux packages (AppImage, deb, rpm, Arch) do carry Vela's own build of
# mpv's LIBRARY, the set the experimental embedded player loads and the only
# one it will load (docs/development.md, "The shipped libmpv set"). The
# `libmpv` job builds it once from the pins; the two jobs that make Linux
# packages put it in, and each then proves it is whole in every package it
# made. The `libmpv-windows` job likewise builds the Windows DLL set once;
# the Windows leg packages and checks it in both NSIS and MSI installers.
# The macOS universal set travels through the same path: framework dylibs
# are signed inside out by Tauri and checked inside the notarized app.
#
# Code signing: the macOS app is signed with a Developer ID certificate and
# notarized through App Store Connect when the secrets for it are set, and
# built unsigned when they are absent, so a run from a fork or a clone without
# secrets still goes green. The Windows installers are NOT signed: they were,
# for 1.0.60, with Azure Trusted Signing, which the owner dropped on
# 2026-11-16 (.agents/decisions.md); no other way of signing them is set up.
# Linux and Arch artifacts are never signed.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.2
          node scripts/check-js-toolchain.mjs
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # The same gate as ci.yml's job of this name: a known vulnerability in a
  # Rust dependency fails the release as it fails CI. An advisory can be
  # published between the last push to main and the tag.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  libmpv:
    name: Shipped libmpv set (Linux x86_64)
    # The same build, cache key and checks as ci.yml's job of this name, so a
    # release of a commit CI has built restores the set CI proved. Built on the
    # distribution the Linux bundles are built on (the glibc floor).
    needs: [npm-audit, cargo-audit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore the built set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out
          key: libmpv-linux-x86_64-${{ hashFiles('scripts/build-libmpv.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/Containerfile', 'packaging/libmpv/patches/**') }}

      - name: Build the set
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-libmpv.sh --container

      # Cached or freshly built, the set is proved before it goes into any
      # package: it must match its manifest, load, and decode on the build
      # baseline and on two newer distributions.
      - name: Load and decode on clean distributions
        run: |
          packaging/libmpv/check-in-container.sh docker.io/library/ubuntu:22.04
          packaging/libmpv/check-in-container.sh docker.io/library/debian:12
          packaging/libmpv/check-in-container.sh registry.fedoraproject.org/fedora:latest

      # Not a release artifact: the inventory job takes only `vela-*`.
      - name: Hand the set to the Linux package jobs
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-linux-x86_64
          if-no-files-found: error
          path: .libmpv/out/libmpv

  libmpv-windows:
    name: Shipped libmpv set (Windows x86_64 cross build)
    needs: [npm-audit, cargo-audit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Identical to CI's libmpv-windows cache: reuse the pinned build.
      - name: Restore the built set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out/libmpv-windows-x86_64
          key: libmpv-windows-x86_64-${{ hashFiles('scripts/build-libmpv-windows.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/Containerfile.windows', 'packaging/libmpv/windows-license-notes.txt', 'packaging/libmpv/windows-pe.py', 'packaging/libmpv/windows/**') }}
      - name: Build the Windows set
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libmpv-windows.sh --container
      - name: Check the manifest
        run: python3 -B packaging/libmpv/check-libmpv-windows.py .libmpv/out/libmpv-windows-x86_64 --manifest-only
      - name: Hand the set to the Windows package job
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-windows-x86_64
          if-no-files-found: error
          path: .libmpv/out/libmpv-windows-x86_64

  libmpv-macos:
    name: Shipped libmpv set (macOS universal)
    # Releases always require it, with CI's toolchain record and cache key.
    needs: [npm-audit, cargo-audit]
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Prepare host tools and record the Apple toolchain
        run: bash packaging/libmpv/macos/prepare-tools.sh
      - name: Restore the universal set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out/libmpv-macos-universal
          key: libmpv-macos-universal-${{ hashFiles('scripts/build-libmpv-macos.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/macos/**', 'packaging/libmpv/check-libmpv-macos.py', '.github/workflows/ci.yml', '.libmpv/toolchain-macos.txt') }}
      - name: Build the universal set
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .libmpv/logs-macos
          bash scripts/build-libmpv-macos.sh 2>&1 | tee .libmpv/logs-macos/build.log
      - name: Prepare Rosetta
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/python3 -I -c 'import platform; assert platform.machine() == "x86_64"'; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Load and play both architectures
        run: |
          set -euo pipefail
          mkdir -p .libmpv/logs-macos
          /usr/bin/python3 -I -B packaging/libmpv/check-libmpv-macos.py .libmpv/out/libmpv-macos-universal --log-dir .libmpv/logs-macos 2>&1 | tee .libmpv/logs-macos/check.log
      - name: Upload the universal set
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-universal
          if-no-files-found: error
          path: .libmpv/out/libmpv-macos-universal
      - name: Keep macOS build and check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-logs
          path: |
            .libmpv/logs-macos
            .libmpv/toolchain-macos.txt

  bundle:
    needs: [npm-audit, cargo-audit, libmpv, libmpv-windows, libmpv-macos]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .app/.dmg that runs on both Apple Silicon and Intel.
          - os: macos-latest
            target: universal-apple-darwin
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          # Older LTS for a lower glibc floor, so the .deb/.AppImage run widely.
          - os: ubuntu-22.04
            target: ''
            bundle_dir: src-tauri/target/release/bundle
          - os: windows-latest
            target: ''
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The last two lines are for the libmpv set: the tools the package check
      # unpacks with, and the system libraries the set itself loads from the
      # machine (the check loads the library out of each finished package).
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libarchive-tools squashfs-tools python3 \
            libegl1 libva2 libva-drm2 libdrm2 libpulse0 libasound2 libfontconfig1 libgnutls30 zlib1g

      # Where src-tauri/tauri.libmpv.conf.json, the overlay the Linux build is
      # given below, takes the set from.
      - name: Fetch the libmpv set (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/download-artifact@v8
        with:
          name: libmpv-linux-x86_64
          path: .libmpv/out/libmpv

      - name: Fetch the libmpv set (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v8
        with:
          name: libmpv-windows-x86_64
          path: .libmpv/out/libmpv-windows-x86_64

      - name: Fetch the libmpv set (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v8
        with:
          name: libmpv-macos-universal
          path: .libmpv/out/libmpv-macos-universal

      - name: Prepare macOS packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-macos-package.sh
          # Tauri owns the temporary signing keychain. This wrapper adds
          # runtime + timestamp to its framework dylib signing calls only.
          echo "$GITHUB_WORKSPACE/.libmpv/sign-tools" >> "$GITHUB_PATH"
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          if ! /usr/bin/arch -x86_64 /usr/bin/python3 -I -c 'import platform; assert platform.machine() == "x86_64"'; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
          architecture: x64

      - name: Check Windows packaging prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -B packaging/libmpv/check-package-windows.py --set .libmpv/out/libmpv-windows-x86_64 --preflight

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both arches for the macOS universal build; harmless empty elsewhere.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.2
          node scripts/check-js-toolchain.mjs
      - run: npm ci

      # tauri-cli signs macOS itself: it imports APPLE_CERTIFICATE into a
      # temporary keychain it creates and deletes (so KEYCHAIN_PASSWORD is not
      # needed here), then notarizes and staples the .app once APPLE_API_KEY,
      # APPLE_API_ISSUER and APPLE_API_KEY_PATH are set. It only tests those
      # variables for PRESENCE, and a missing repository secret arrives as an
      # empty-but-defined variable — an empty APPLE_CERTIFICATE would therefore
      # read as "please sign" and fail the build. So nothing is exported unless
      # the whole set is non-empty, which leaves a secretless run unsigned and
      # green. Notarization also degrades to a warning inside tauri-cli, so the
      # verification step further down asserts on the finished bundle.
      - name: Prepare macOS signing
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          present=''
          missing=''
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8
          do
            if [ -n "$(printenv "$name" || true)" ]; then
              present="$present $name"
            else
              missing="$missing $name"
            fi
          done

          if [ -z "$present" ]; then
            echo 'signing=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Unsigned macOS build::No Apple signing secrets are set; the .app and .dmg stay unsigned.'
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Incomplete Apple signing secrets::Set all of them or none. Missing:$missing"
            exit 1
          fi

          # notarytool wants the key as a file named after its key id.
          key_dir="$RUNNER_TEMP/private_keys"
          key_path="$key_dir/AuthKey_$APPLE_API_KEY.p8"
          mkdir -p "$key_dir"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          # Heredoc form because a secret may legitimately contain newlines.
          put() {
            {
              printf '%s<<VELA_SIGNING_ENV\n' "$1"
              printf '%s\n' "$2"
              printf 'VELA_SIGNING_ENV\n'
            } >> "$GITHUB_ENV"
          }

          # Whitespace is not in the base64 alphabet, so folding a line-wrapped
          # certificate export back onto one line is safe and keeps decoders that
          # reject embedded newlines happy.
          put APPLE_CERTIFICATE "$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]')"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          put APPLE_API_ISSUER "$APPLE_API_ISSUER"
          put APPLE_API_KEY "$APPLE_API_KEY"
          put APPLE_API_KEY_PATH "$key_path"

          echo 'signing=true' >> "$GITHUB_OUTPUT"

      # Builds the frontend (beforeBuildCommand) + the Rust release binary and
      # produces the native installers, signed on macOS whenever the step above
      # found its secrets. The Apple variables arrive through GITHUB_ENV so they
      # are absent rather than empty on a secretless run. Nothing signs the
      # Windows installers.
      #
      # No leg creates or touches a release: tauri-action uploads in the step
      # that builds, before the checks below. Only inventory creates the draft
      # and attaches the checked packages, after every package job passes.
      #
      # NO_STRIP and APPIMAGE_EXTRACT_AND_RUN are for the AppImage tooling and
      # mean nothing elsewhere: linuxdeploy's own `strip` must not rewrite the
      # libraries of the libmpv set, which ship exactly as their MANIFEST
      # records them (scripts/build.sh sets the same two for its AppImage).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          # macOS dylibs are framework sign targets; notices stay resources.
          args: ${{ matrix.target && format('--target {0} --bundles app,dmg --config .libmpv/tauri.libmpv-macos.conf.json', matrix.target) || (matrix.os == 'windows-latest' && '--bundles nsis,msi --config src-tauri/tauri.libmpv-windows.conf.json' || (matrix.os == 'ubuntu-22.04' && '--config src-tauri/tauri.libmpv.conf.json' || '')) }}

      - name: Require the universal macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          compgen -G '${{ matrix.bundle_dir }}/dmg/*.dmg' >/dev/null || {
            echo 'The universal macOS DMG is missing.' >&2
            exit 1
          }

      # codesign can no-op and still exit 0, and tauri-cli downgrades a failed
      # notarization to a warning, so the signed path has to be asserted rather
      # than assumed. tauri notarizes and STAPLES THE .app, then signs the .dmg
      # that wraps it without submitting the image itself — the ticket Gatekeeper
      # reads travels inside the app, so `stapler validate` belongs on the app.
      - name: Require a signed and notarized macOS bundle
        if: runner.os == 'macOS' && steps.macos_signing.outputs.signing == 'true'
        shell: bash
        run: |
          set -euo pipefail

          app="$(find '${{ matrix.bundle_dir }}/macos' -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find '${{ matrix.bundle_dir }}/dmg' -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$app"
          test -f "$dmg"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep 'Authority=Developer ID Application'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          # src-tauri/Info.plist is merged into the app's: macOS asks before an
          # app reaches the local network, where Vela's servers usually are.
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist"

          codesign --verify --strict --verbose=2 "$dmg"
          codesign -dv --verbose=4 "$dmg" 2>&1 | grep 'Authority=Developer ID Application'

      - name: Require the libmpv set in the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          VELA_MACOS_SIGNED: ${{ steps.macos_signing.outputs.signing }}
        run: |
          set -euo pipefail
          # Mount the final DMG read-only; prove and play its untouched app.
          bash scripts/check-macos-package.sh '${{ matrix.bundle_dir }}' "$VELA_MACOS_SIGNED"

      - name: Require every Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for pattern in \
            '${{ matrix.bundle_dir }}/appimage/*.AppImage' \
            '${{ matrix.bundle_dir }}/deb/*.deb' \
            '${{ matrix.bundle_dir }}/rpm/*.rpm'
          do
            compgen -G "$pattern" >/dev/null || {
              echo "Required Linux artifact is missing: $pattern" >&2
              exit 1
            }
          done

      # The embedded player has no other library to fall back on: a package
      # that lacks one file of the set installs cleanly and then never plays
      # embedded. Each bundle is unpacked (nothing is installed) and must hold
      # the whole set, unmodified, loadable from where it will be installed.
      - name: Require the libmpv set in every Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packaging/libmpv/check-package.sh --set .libmpv/out/libmpv \
            '${{ matrix.bundle_dir }}'/appimage/*.AppImage \
            '${{ matrix.bundle_dir }}'/deb/*.deb \
            '${{ matrix.bundle_dir }}'/rpm/*.rpm

      - name: Require both Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @('msi/*.msi', 'nsis/*-setup.exe') | ForEach-Object {
            $pattern = Join-Path '${{ matrix.bundle_dir }}' $_
            if (-not (Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)) {
              throw "Required Windows artifact is missing: $pattern"
            }
          }

      - name: Require the libmpv set in every Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B packaging/libmpv/check-package-windows.py --set .libmpv/out/libmpv-windows-x86_64 --bundle-dir '${{ matrix.bundle_dir }}'

      - name: Upload the macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: vela-macos
          if-no-files-found: error
          path: ${{ matrix.bundle_dir }}/dmg/*.dmg

      - name: Upload the Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: vela-linux
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/rpm/*.rpm

      - name: Upload the Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: vela-windows
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*-setup.exe

  arch:
    name: Arch package
    needs: [npm-audit, cargo-audit, libmpv]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # The second group is for the libmpv set: Python for the package check,
      # and the system libraries the set itself loads from the machine (the
      # check loads the library out of the finished package).
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            hicolor-icon-theme \
            libappindicator-gtk3 \
            librsvg \
            libsoup3 \
            mpv \
            patchelf \
            rustup \
            webkit2gtk-4.1 \
            python \
            libglvnd libva libdrm libpulse alsa-lib fontconfig gnutls zlib

      - uses: actions/checkout@v7

      # Before the workspace is handed to the builder, so that it owns the set.
      - name: Fetch the libmpv set
        uses: actions/download-artifact@v8
        with:
          name: libmpv-linux-x86_64
          path: .libmpv/out/libmpv

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pinned npm
        run: npm install --global npm@12.0.2

      - name: Prepare non-root package builder
        run: |
          useradd --create-home vela-builder
          chown -R vela-builder:vela-builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        shell: bash
        run: |
          # VELA_PACKAGE_LIBMPV is how the PKGBUILD is told to install the set
          # (makepkg cannot pass it an argument); it is set for this one build.
          runuser -u vela-builder -- env \
            HOME=/home/vela-builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            VELA_PACKAGE_LIBMPV="$GITHUB_WORKSPACE/.libmpv/out/libmpv" \
            PATH="$PATH" \
            bash -c '
              set -euo pipefail
              export PATH="$HOME/.cargo/bin:$PATH"
              cd "$GITHUB_WORKSPACE"
              rustup default stable
              node scripts/check-js-toolchain.mjs
              npm ci
              npm run build:arch
            '

      - name: Require the Arch package
        shell: bash
        run: |
          compgen -G 'packaging/arch/*.pkg.tar.zst' >/dev/null || {
            echo 'The Arch package is missing.' >&2
            exit 1
          }

      # As for the other Linux packages: the whole set, unmodified, loadable,
      # and its licence texts where Arch keeps licences.
      - name: Require the libmpv set in the Arch package
        shell: bash
        run: |
          packaging/libmpv/check-package.sh --set .libmpv/out/libmpv \
            packaging/arch/*.pkg.tar.zst

      - name: Upload the Arch package
        uses: actions/upload-artifact@v7
        with:
          name: vela-arch
          if-no-files-found: error
          path: packaging/arch/*.pkg.tar.zst

  inventory:
    name: Verify release inventory
    needs: [bundle, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only what is released. The libmpv set travels between jobs as an
      # artifact too, and is inside the packages, not beside them.
      - uses: actions/download-artifact@v8
        with:
          pattern: vela-*
          path: artifacts

      - name: Require every promised artifact
        shell: bash
        run: |
          set -euo pipefail

          require_one() {
            label="$1"
            root="$2"
            pattern="$3"
            find "$root" -type f -name "$pattern" -print -quit |
              grep -q . || {
                echo "Missing release artifact: $label" >&2
                exit 1
              }
          }

          require_one 'universal macOS DMG' artifacts/vela-macos '*.dmg'
          require_one 'Linux AppImage' artifacts/vela-linux '*.AppImage'
          require_one 'Debian package' artifacts/vela-linux '*.deb'
          require_one 'RPM package' artifacts/vela-linux '*.rpm'
          require_one 'Windows MSI' artifacts/vela-windows '*.msi'
          require_one 'Windows NSIS installer' artifacts/vela-windows '*-setup.exe'
          require_one 'Arch package' artifacts/vela-arch '*.pkg.tar.zst'

          while IFS= read -r -d '' file; do
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$file")"
          done < <(find artifacts -type f ! -name SHA256SUMS -print0 | sort -z) > artifacts/SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: vela-sha256sums
          if-no-files-found: error
          path: artifacts/SHA256SUMS

      # Only a tag push creates or reuses a draft, after all package checks.
      # Never change a published release. macOS releases only the checked DMG;
      # the duplicate .app.tar.gz is not an artifact or a release asset.
      - name: Prepare tagged draft and attach checked packages and checksums
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' macos < <(
            find artifacts/vela-macos -type f -name '*.dmg' -print0 | sort -z
          )
          [ "${#macos[@]}" -eq 1 ] || {
            echo "Expected one universal macOS DMG; found ${#macos[@]}." >&2
            exit 1
          }
          mapfile -d '' linux < <(
            find artifacts/vela-linux -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z
          )
          [ "${#linux[@]}" -eq 3 ] || {
            echo "Expected the AppImage, the deb and the rpm; found ${#linux[@]} Linux bundles." >&2
            exit 1
          }
          mapfile -d '' windows < <(
            find artifacts/vela-windows -type f \
              \( -name '*.msi' -o -name '*-setup.exe' \) -print0 | sort -z
          )
          [ "${#windows[@]}" -eq 2 ] || {
            echo "Expected the MSI and NSIS installers; found ${#windows[@]} Windows bundles." >&2
            exit 1
          }

          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"; then
            [ "$draft" = true ] || {
              echo "Refusing to upload to a published release: $GITHUB_REF_NAME" >&2
              exit 1
            }
          else
            # A failed lookup cannot authorize an upload: creation must succeed
            # (and fails if a release already exists or the tag is absent).
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Vela $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "${macos[@]}" \
            "${linux[@]}" \
            "${windows[@]}" \
            artifacts/vela-arch/*.pkg.tar.zst \
            artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
