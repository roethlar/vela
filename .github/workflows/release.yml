name: Release

# Builds installable bundles for every target OS. Run it manually from the
# Actions tab (workflow_dispatch) to get downloadable artifacts, or push a
# `v*` tag to also attach them to a draft GitHub release.
#
# mpv is intentionally NOT bundled — Vela detects it at runtime and prompts the
# user to install it (copyable command + "Get mpv" link), so these packages stay
# small and the player stays user-updatable.
#
# Code signing is secrets-gated per platform: macOS via a Developer ID
# certificate plus App Store Connect notarization, Windows via Azure Trusted
# Signing. Each platform falls back to an unsigned build when its secrets are
# absent, so a run from a fork or a clone without secrets still goes green.
# Linux and Arch artifacts are never signed.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.1
          node scripts/check-js-toolchain.mjs
      - run: npm ci
      - run: npm audit

  bundle:
    needs: npm-audit
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .app/.dmg that runs on both Apple Silicon and Intel.
          - os: macos-latest
            target: universal-apple-darwin
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          # Older LTS for a lower glibc floor, so the .deb/.AppImage run widely.
          - os: ubuntu-22.04
            target: ''
            bundle_dir: src-tauri/target/release/bundle
          - os: windows-latest
            target: ''
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both arches for the macOS universal build; harmless empty elsewhere.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.1
          node scripts/check-js-toolchain.mjs
      - run: npm ci

      # tauri-cli signs macOS itself: it imports APPLE_CERTIFICATE into a
      # temporary keychain it creates and deletes (so KEYCHAIN_PASSWORD is not
      # needed here), then notarizes and staples the .app once APPLE_API_KEY,
      # APPLE_API_ISSUER and APPLE_API_KEY_PATH are set. It only tests those
      # variables for PRESENCE, and a missing repository secret arrives as an
      # empty-but-defined variable — an empty APPLE_CERTIFICATE would therefore
      # read as "please sign" and fail the build. So nothing is exported unless
      # the whole set is non-empty, which leaves a secretless run unsigned and
      # green. Notarization also degrades to a warning inside tauri-cli, so the
      # verification step further down asserts on the finished bundle.
      - name: Prepare macOS signing
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          present=''
          missing=''
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8
          do
            if [ -n "$(printenv "$name" || true)" ]; then
              present="$present $name"
            else
              missing="$missing $name"
            fi
          done

          if [ -z "$present" ]; then
            echo 'signing=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Unsigned macOS build::No Apple signing secrets are set; the .app and .dmg stay unsigned.'
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Incomplete Apple signing secrets::Set all of them or none. Missing:$missing"
            exit 1
          fi

          # notarytool wants the key as a file named after its key id.
          key_dir="$RUNNER_TEMP/private_keys"
          key_path="$key_dir/AuthKey_$APPLE_API_KEY.p8"
          mkdir -p "$key_dir"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          # Heredoc form because a secret may legitimately contain newlines.
          put() {
            {
              printf '%s<<VELA_SIGNING_ENV\n' "$1"
              printf '%s\n' "$2"
              printf 'VELA_SIGNING_ENV\n'
            } >> "$GITHUB_ENV"
          }

          # Whitespace is not in the base64 alphabet, so folding a line-wrapped
          # certificate export back onto one line is safe and keeps decoders that
          # reject embedded newlines happy.
          put APPLE_CERTIFICATE "$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]')"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          put APPLE_API_ISSUER "$APPLE_API_ISSUER"
          put APPLE_API_KEY "$APPLE_API_KEY"
          put APPLE_API_KEY_PATH "$key_path"

          echo 'signing=true' >> "$GITHUB_OUTPUT"

      # Windows has to be signed DURING bundling, because the tauri-action step
      # below both builds and uploads to the draft release — signing afterwards
      # would leave unsigned assets published. Tauri's
      # `bundle > windows > signCommand` hook runs once per binary, installer and
      # WiX extension, so it covers everything the release carries. The override
      # goes into src-tauri/tauri.windows.conf.json, which tauri merges
      # automatically for Windows targets; it is written only here, so the
      # committed tauri.conf.json keeps building unsigned locally. Without the
      # full non-empty secret set no hook is injected at all.
      - name: Prepare Windows code signing
        id: windows_signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'

          $names = @(
            'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET',
            'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
          )
          $missing = @($names | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })

          if ($missing.Count -eq $names.Count) {
            'signing=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output '::notice title=Unsigned Windows build::No Azure Trusted Signing secrets are set; the installers stay unsigned.'
            exit 0
          }
          if ($missing.Count -gt 0) {
            throw "Incomplete Azure Trusted Signing secrets; set all of them or none. Missing: $($missing -join ', ')"
          }

          # Runners normally ship NuGet already, so a failure here is only fatal
          # if Install-Module then cannot reach the gallery.
          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          } catch {
            Write-Output "::debug::Install-PackageProvider NuGet failed: $($_.Exception.Message)"
          }
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser

          # Absolute, because the bundler's working directory is its own business.
          # Forward slashes and plain concatenation on purpose: NSIS embeds this
          # command verbatim to sign the uninstaller and a backslash path survives
          # that round trip escaped, and Join-Path would resolve the drive through
          # the PowerShell provider.
          $sign = ($env:GITHUB_WORKSPACE -replace '\\', '/').TrimEnd('/') + '/.github/scripts/azure-sign.ps1'
          if (-not (Test-Path -LiteralPath $sign -PathType Leaf)) {
            throw "The signing script is missing at $sign."
          }

          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd  = 'pwsh'
                  args = @('-NoProfile', '-NonInteractive', '-File', $sign, '%1')
                }
              }
            }
          } | ConvertTo-Json -Depth 8 |
            Set-Content -Path 'src-tauri/tauri.windows.conf.json' -Encoding utf8

          'signing=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Builds the frontend (beforeBuildCommand) + the Rust release binary and
      # produces the native installers, signed on macOS and Windows whenever the
      # steps above found their secrets. The Apple variables arrive through
      # GITHUB_ENV so they are absent rather than empty on a secretless run; the
      # Azure ones are safe to declare unconditionally because they are only read
      # by azure-sign.ps1, which no signCommand invokes unless it was injected.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # Only create/attach a release when triggered by a v* tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Vela {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Require the universal macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          compgen -G '${{ matrix.bundle_dir }}/dmg/*.dmg' >/dev/null || {
            echo 'The universal macOS DMG is missing.' >&2
            exit 1
          }

      # codesign can no-op and still exit 0, and tauri-cli downgrades a failed
      # notarization to a warning, so the signed path has to be asserted rather
      # than assumed. tauri notarizes and STAPLES THE .app, then signs the .dmg
      # that wraps it without submitting the image itself — the ticket Gatekeeper
      # reads travels inside the app, so `stapler validate` belongs on the app.
      - name: Require a signed and notarized macOS bundle
        if: runner.os == 'macOS' && steps.macos_signing.outputs.signing == 'true'
        shell: bash
        run: |
          set -euo pipefail

          app="$(find '${{ matrix.bundle_dir }}/macos' -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find '${{ matrix.bundle_dir }}/dmg' -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$app"
          test -f "$dmg"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep 'Authority=Developer ID Application'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          codesign --verify --strict --verbose=2 "$dmg"
          codesign -dv --verbose=4 "$dmg" 2>&1 | grep 'Authority=Developer ID Application'

      - name: Require every Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for pattern in \
            '${{ matrix.bundle_dir }}/appimage/*.AppImage' \
            '${{ matrix.bundle_dir }}/deb/*.deb' \
            '${{ matrix.bundle_dir }}/rpm/*.rpm'
          do
            compgen -G "$pattern" >/dev/null || {
              echo "Required Linux artifact is missing: $pattern" >&2
              exit 1
            }
          done

      - name: Require both Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @('msi/*.msi', 'nsis/*-setup.exe') | ForEach-Object {
            $pattern = Join-Path '${{ matrix.bundle_dir }}' $_
            if (-not (Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue)) {
              throw "Required Windows artifact is missing: $pattern"
            }
          }

      # azure-sign.ps1 already asserts per file, but that only proves the hook ran
      # on the files it was handed; this proves the two installers the release
      # actually ships came out signed. Get-AuthenticodeSignature is built in, so
      # no signtool is needed.
      - name: Require signed Windows installers
        if: runner.os == 'Windows' && steps.windows_signing.outputs.signing == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @('msi/*.msi', 'nsis/*-setup.exe') | ForEach-Object {
            $pattern = Join-Path '${{ matrix.bundle_dir }}' $_
            Get-ChildItem -Path $pattern | ForEach-Object {
              $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
              if ($signature.Status -ne 'Valid') {
                throw "Authenticode status for $($_.Name) is '$($signature.Status)', expected 'Valid'."
              }
              Write-Output "$($_.Name): $($signature.Status) — $($signature.SignerCertificate.Subject)"
            }
          }

      - name: Upload the macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: vela-macos
          if-no-files-found: error
          path: ${{ matrix.bundle_dir }}/dmg/*.dmg

      - name: Upload the Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: vela-linux
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/rpm/*.rpm

      - name: Upload the Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: vela-windows
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*-setup.exe

  arch:
    name: Arch package
    needs: npm-audit
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            hicolor-icon-theme \
            libappindicator-gtk3 \
            librsvg \
            libsoup3 \
            mpv \
            patchelf \
            rustup \
            webkit2gtk-4.1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pinned npm
        run: npm install --global npm@12.0.1

      - name: Prepare non-root package builder
        run: |
          useradd --create-home vela-builder
          chown -R vela-builder:vela-builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        shell: bash
        run: |
          runuser -u vela-builder -- env \
            HOME=/home/vela-builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            PATH="$PATH" \
            bash -c '
              set -euo pipefail
              export PATH="$HOME/.cargo/bin:$PATH"
              cd "$GITHUB_WORKSPACE"
              rustup default stable
              node scripts/check-js-toolchain.mjs
              npm ci
              npm run build:arch
            '

      - name: Require the Arch package
        shell: bash
        run: |
          compgen -G 'packaging/arch/*.pkg.tar.zst' >/dev/null || {
            echo 'The Arch package is missing.' >&2
            exit 1
          }

      - name: Upload the Arch package
        uses: actions/upload-artifact@v7
        with:
          name: vela-arch
          if-no-files-found: error
          path: packaging/arch/*.pkg.tar.zst

  inventory:
    name: Verify release inventory
    needs: [bundle, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Require every promised artifact
        shell: bash
        run: |
          set -euo pipefail

          require_one() {
            label="$1"
            root="$2"
            pattern="$3"
            find "$root" -type f -name "$pattern" -print -quit |
              grep -q . || {
                echo "Missing release artifact: $label" >&2
                exit 1
              }
          }

          require_one 'universal macOS DMG' artifacts/vela-macos '*.dmg'
          require_one 'Linux AppImage' artifacts/vela-linux '*.AppImage'
          require_one 'Debian package' artifacts/vela-linux '*.deb'
          require_one 'RPM package' artifacts/vela-linux '*.rpm'
          require_one 'Windows MSI' artifacts/vela-windows '*.msi'
          require_one 'Windows NSIS installer' artifacts/vela-windows '*-setup.exe'
          require_one 'Arch package' artifacts/vela-arch '*.pkg.tar.zst'

          while IFS= read -r -d '' file; do
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$file")"
          done < <(find artifacts -type f ! -name SHA256SUMS -print0 | sort -z) > artifacts/SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: vela-sha256sums
          if-no-files-found: error
          path: artifacts/SHA256SUMS

      - name: Attach Arch package and checksums to tagged draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/vela-arch/*.pkg.tar.zst \
            artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
