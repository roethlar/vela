name: Platform probe

# Manual only. Runs one probe from probes/ on a hosted macOS or Windows runner
# and keeps what it writes to probe-out/ (screenshots, logs) as an artifact.
# The probes answer the open questions of the macOS and Windows slices of
# .agents/plans/embedded-player.md (amendment of 2026-11-16) before any product
# code is written for them, or check product code on a platform no test runs
# on. Nothing here signs or ships Vela, and no secret is given to a probe: only
# the job's own token, which can read this repository and its workflow runs'
# artifacts (a probe may take CI's libmpv set instead of building one).

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'The probe to run: a directory under probes/'
        required: true
      os:
        description: 'The runner: windows-latest or macos-latest'
        required: true
        default: windows-latest

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7

      # A probe that builds Vela needs the repository's Node (and installs
      # its npm itself).
      - uses: actions/setup-node@v7
        if: startsWith(inputs.probe, 'm2-') || inputs.probe == 'w2-vela' || inputs.probe == 'w3-webdriver'
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Run the probe
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
          PROBE_OUT: ${{ github.workspace }}/probe-out
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          case "$PROBE" in
            ''|*[!a-z0-9-]*) echo "a probe is named by lower-case letters, digits and dashes: '$PROBE'" >&2; exit 2 ;;
          esac
          test -f "probes/$PROBE/run.sh" || { echo "no probes/$PROBE/run.sh" >&2; exit 2; }
          mkdir -p "$PROBE_OUT"
          bash "probes/$PROBE/run.sh"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ inputs.probe }}-${{ inputs.os }}
          path: probe-out
          if-no-files-found: warn
