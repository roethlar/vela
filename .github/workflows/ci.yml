name: CI

on:
  push:
    branches: [main, master, vela-foundation]
  pull_request:

jobs:
  backend:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs the WebKitGTK / soup / gtk dev libraries even
      # for `cargo check`/`clippy` (tauri-build + the webview crates link them).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: npm run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true # advisory only; don't block on transient advisories
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
