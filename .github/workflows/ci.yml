name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK / soup / gtk dev libraries even
      # for `cargo check`/`clippy` (tauri-build + the webview crates link them).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check declared Rust 1.89 MSRV
        run: cargo +1.89.0 check --locked
      - run: cargo +stable check --locked
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.2
          node scripts/check-js-toolchain.mjs
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build

  libmpv:
    name: Shipped libmpv set (Linux x86_64)
    # The library set the embedded player loads (.agents/plans/embedded-player.md).
    # Built inside packaging/libmpv/Containerfile, so the runner only has to match
    # the release's Linux runner for the checks that follow.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The build takes several minutes and its inputs change rarely. The key
      # hashes every input, so a cached set is exactly what a fresh build of
      # this commit would produce from the pins.
      - name: Restore the built set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out
          key: libmpv-linux-x86_64-${{ hashFiles('scripts/build-libmpv.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/Containerfile', 'packaging/libmpv/patches/**') }}

      - name: Build the set
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-libmpv.sh --container

      # Cached or freshly built, the set is proved every time: it must match
      # its manifest, load, and decode on the build baseline itself and on two
      # newer distributions, in images with no development packages.
      - name: Load and decode on clean distributions
        run: |
          packaging/libmpv/check-in-container.sh docker.io/library/ubuntu:22.04
          packaging/libmpv/check-in-container.sh docker.io/library/debian:12
          packaging/libmpv/check-in-container.sh registry.fedoraproject.org/fedora:latest

      - name: Upload the set
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-linux-x86_64
          if-no-files-found: error
          path: .libmpv/out/libmpv

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # A known vulnerability FAILS the build (owner, 2026-07-14: "known vulnerabilities
    # should fail so we can keep current").
    #
    # This job used to be `continue-on-error: true`, which meant CI went GREEN while
    # reporting them — and it did, for two RUSTSEC DoS advisories in `quick-xml`, the crate
    # that parses every Plex response Vela receives off the network. Nobody looks at a job
    # that cannot fail.
    #
    # If an advisory lands with NO fix available upstream, do not re-disable this job. Add
    # an explicit `--ignore RUSTSEC-XXXX-NNNN` below with a comment saying why and when to
    # revisit: a visible exception in the diff, not a silent blanket.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
