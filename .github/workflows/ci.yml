name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK / soup / gtk dev libraries even
      # for `cargo check`/`clippy` (tauri-build + the webview crates link them).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.1
          node --input-type=module -e "import { execSync } from 'node:child_process'; const npm = execSync('npm --version', { encoding: 'utf8' }).trim(); if (process.version !== 'v26.5.0' || npm !== '12.0.1') { throw new Error('expected Node v26.5.0/npm 12.0.1; got ' + process.version + '/npm ' + npm); }"
      - run: npm ci
      - run: npm run check
      - run: npm run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # A known vulnerability FAILS the build (owner, 2026-07-14: "known vulnerabilities
    # should fail so we can keep current").
    #
    # This job used to be `continue-on-error: true`, which meant CI went GREEN while
    # reporting them — and it did, for two RUSTSEC DoS advisories in `quick-xml`, the crate
    # that parses every Plex response Vela receives off the network. Nobody looks at a job
    # that cannot fail.
    #
    # If an advisory lands with NO fix available upstream, do not re-disable this job. Add
    # an explicit `--ignore RUSTSEC-XXXX-NNNN` below with a comment saying why and when to
    # revisit: a visible exception in the diff, not a silent blanket.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
