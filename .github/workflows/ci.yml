name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand too, for a fresh run on demand (e2e-windows.yml downloads an
  # artifact of this workflow's newest successful run on main).
  workflow_dispatch:

jobs:
  backend:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK / soup / gtk dev libraries even
      # for `cargo check`/`clippy` (tauri-build + the webview crates link them).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check declared Rust 1.89 MSRV
        run: cargo +1.89.0 check --locked
      - run: cargo +stable check --locked
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked

  other-platforms:
    name: Rust compiles (${{ matrix.os }})
    # The release builds for macOS and Windows, and nothing else compiled the
    # backend there between releases: a break was found at the tag, after the
    # fact. This checks both architectures of the universal macOS release
    # and the Windows host target. It runs no test and builds no bundle;
    # a warning does not fail it.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check macOS (Apple Silicon)
        if: runner.os == 'macOS'
        run: cargo +stable check --locked --target aarch64-apple-darwin
      - name: Check macOS (Intel)
        if: runner.os == 'macOS'
        run: cargo +stable check --locked --target x86_64-apple-darwin
      - name: Check Windows
        if: runner.os == 'Windows'
        run: cargo +stable check --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned npm
        run: |
          npm install --global npm@12.0.2
          node scripts/check-js-toolchain.mjs
      - run: npm ci
      - run: npm audit --audit-level=moderate
      # The package-check tests (run by `npm run check`) pack and unpack
      # stand-in packages with bsdtar, and one of them reads a real squashfs.
      # Without the tools they skip, and a skipped test holds nothing.
      - name: Install bsdtar and squashfs-tools for the package-check tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools squashfs-tools
      - run: npm run check
      - run: npm run build

  libmpv:
    name: Shipped libmpv set (Linux x86_64)
    # The library set the embedded player loads (.agents/plans/embedded-player.md).
    # Built inside packaging/libmpv/Containerfile, so the runner only has to match
    # the release's Linux runner for the checks that follow.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The build takes several minutes and its inputs change rarely. The key
      # hashes every input, so a cached set is exactly what a fresh build of
      # this commit would produce from the pins.
      - name: Restore the built set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out
          key: libmpv-linux-x86_64-${{ hashFiles('scripts/build-libmpv.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/Containerfile', 'packaging/libmpv/patches/**') }}

      - name: Build the set
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-libmpv.sh --container

      # Cached or freshly built, the set is proved every time: it must match
      # its manifest, load, and decode on the build baseline itself and on two
      # newer distributions, in images with no development packages.
      - name: Load and decode on clean distributions
        run: |
          packaging/libmpv/check-in-container.sh docker.io/library/ubuntu:22.04
          packaging/libmpv/check-in-container.sh docker.io/library/debian:12
          packaging/libmpv/check-in-container.sh registry.fedoraproject.org/fedora:latest

      - name: Upload the set
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-linux-x86_64
          if-no-files-found: error
          path: .libmpv/out/libmpv

  libmpv-windows:
    name: Shipped libmpv set (Windows x86_64 cross build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore the built set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out/libmpv-windows-x86_64
          key: libmpv-windows-x86_64-${{ hashFiles('scripts/build-libmpv-windows.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/Containerfile.windows', 'packaging/libmpv/windows-license-notes.txt', 'packaging/libmpv/windows-pe.py') }}
      - name: Build the Windows set
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libmpv-windows.sh --container
      - name: Check the manifest
        run: python3 -B packaging/libmpv/check-libmpv-windows.py .libmpv/out/libmpv-windows-x86_64 --manifest-only
      - name: Upload the Windows set
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-windows-x86_64
          if-no-files-found: error
          path: .libmpv/out/libmpv-windows-x86_64

  libmpv-windows-check:
    name: Load and play the Windows libmpv set
    needs: libmpv-windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download the Windows set
        uses: actions/download-artifact@v8
        with:
          name: libmpv-windows-x86_64
          path: .libmpv/out/libmpv-windows-x86_64
      - name: Load and play to EOF
        shell: pwsh
        run: python -B packaging/libmpv/check-libmpv-windows.py .libmpv/out/libmpv-windows-x86_64

  libmpv-macos:
    name: Shipped libmpv set (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Prepare host tools and record the Apple toolchain
        run: bash packaging/libmpv/macos/prepare-tools.sh
      - name: Restore the universal set
        id: cache
        uses: actions/cache@v6
        with:
          path: .libmpv/out/libmpv-macos-universal
          key: libmpv-macos-universal-${{ hashFiles('scripts/build-libmpv-macos.sh', 'packaging/libmpv/versions.txt', 'packaging/libmpv/macos/**', 'packaging/libmpv/check-libmpv-macos.py', '.github/workflows/ci.yml', '.libmpv/toolchain-macos.txt') }}
      - name: Build the universal set
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .libmpv/logs-macos
          bash scripts/build-libmpv-macos.sh 2>&1 | tee .libmpv/logs-macos/build.log
      - name: Prepare Rosetta
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/python3 -I -c 'import platform; assert platform.machine() == "x86_64"'; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Load and play both architectures
        run: |
          set -euo pipefail
          mkdir -p .libmpv/logs-macos
          /usr/bin/python3 -I -B packaging/libmpv/check-libmpv-macos.py .libmpv/out/libmpv-macos-universal --log-dir .libmpv/logs-macos 2>&1 | tee .libmpv/logs-macos/check.log
      - name: Upload the universal set
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-universal
          if-no-files-found: error
          path: .libmpv/out/libmpv-macos-universal
      - name: Keep macOS build and check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-macos-logs
          path: |
            .libmpv/logs-macos
            .libmpv/toolchain-macos.txt

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # A known vulnerability FAILS the build (owner, 2026-07-14: "known vulnerabilities
    # should fail so we can keep current").
    #
    # This job used to be `continue-on-error: true`, which meant CI went GREEN while
    # reporting them — and it did, for two RUSTSEC DoS advisories in `quick-xml`, the crate
    # that parses every Plex response Vela receives off the network. Nobody looks at a job
    # that cannot fail.
    #
    # If an advisory lands with NO fix available upstream, do not re-disable this job. Add
    # an explicit `--ignore RUSTSEC-XXXX-NNNN` below with a comment saying why and when to
    # revisit: a visible exception in the diff, not a silent blanket.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
